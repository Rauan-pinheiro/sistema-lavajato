services:
  - type: web
    name: financeiro-lavagem
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn financeiro_lavagem.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: financeiro-lavagem-db
          property: connectionString

databases:
  - name: financeiro-lavagem-db
    plan: free
