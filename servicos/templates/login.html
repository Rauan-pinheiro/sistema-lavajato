{% extends "base.html" %}

{% block title %}Entrar | Financeiro Lava-Rápido{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="card mt-4" style="max-width: 400px; width: 100%;">
        <div class="card-body">
            <h1 class="h4 mb-4 text-center">Entrar</h1>

            {% if form.non_field_errors %}
                <div class="alert alert-danger">
                    {% for error in form.non_field_errors %}
                        {{ error }}
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Usuário</label>
                    <input
                        type="text"
                        name="{{ form.username.html_name }}"
                        id="{{ form.username.id_for_label }}"
                        class="form-control"
                        autofocus
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Senha</label>
                    <input
                        type="password"
                        name="{{ form.password.html_name }}"
                        id="{{ form.password.id_for_label }}"
                        class="form-control"
                        required
                    >
                </div>

                <input type="hidden" name="next" value="{{ next }}">

                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
